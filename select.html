<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wybór widoku</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f0f0 url('data/background.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(240, 240, 240, 0.85);
            z-index: 0;
        }
        .select-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 2.5rem;
            max-width: 780px;
            width: 90%;
        }
        .select-container h1 {
            text-align: center;
            color: #333;
            font-size: 1.5em;
            margin-bottom: 0.5rem;
        }
        .view-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 2rem 2.5rem;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 1.15em;
            color: #333;
            line-height: 1.5;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-decoration: none;
        }
        .view-btn:hover {
            border-color: #007bff;
            box-shadow: 0 4px 16px rgba(0,123,255,0.18);
            transform: translateY(-2px);
        }
        .view-btn:active {
            transform: translateY(0);
        }
        .view-btn strong {
            color: #007bff;
            font-size: 1.1em;
        }
        .view-btn .btn-arrow {
            flex-shrink: 0;
            margin-left: 1rem;
            color: #ccc;
            font-size: 1.4em;
            transition: all 0.2s ease;
        }
        .view-btn:hover .btn-arrow {
            color: #007bff;
            transform: translateX(3px);
        }

        /* ── Dark-mode toggle ── */
        .dm-switch {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 99999;
            width: 52px; height: 28px;
            border-radius: 14px;
            border: 1px solid rgba(0,0,0,.15);
            background: #e2e2e2;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,.12);
            transition: background .3s, border-color .3s;
            padding: 0; margin: 0;
            -webkit-appearance: none; appearance: none;
        }
        .dm-switch:hover { box-shadow: 0 3px 12px rgba(0,0,0,.2); }
        .dm-switch .dm-knob {
            display: block;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,.2);
            margin: 2px;
            transition: transform .3s;
            position: relative;
        }
        .dm-switch .dm-knob::before {
            content: '\263E';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .75rem;
            line-height: 1;
            color: #888;
            transition: content .3s;
        }
        body.dark .dm-switch { background: #4a9eff; border-color: rgba(255,255,255,.15); }
        body.dark .dm-switch .dm-knob { transform: translateX(24px); background: #1e1e2e; }
        body.dark .dm-switch .dm-knob::before { content: '\2600'; color: #ffc107; }

        /* ── Dark-mode overrides ── */
        body.dark { background-color: #121212; }
        body.dark::before { background: rgba(18,18,18,0.92); }
        body.dark .select-container h1 { color: #ddd; }
        body.dark .view-btn { background: #1e1e2e; border-color: #333; color: #ddd; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
        body.dark .view-btn:hover { border-color: #4a9eff; box-shadow: 0 4px 16px rgba(74,158,255,.25); }
        body.dark .view-btn strong { color: #4a9eff; }
        body.dark .view-btn .btn-arrow { color: #555; }
        body.dark .view-btn:hover .btn-arrow { color: #4a9eff; }

    </style>
    <script>
        // Auth guard — must be inside the parent iframe
        let authVerified = false;

        if (window.parent !== window) {
            window.parent.postMessage('checkAuth', '*');
            window.addEventListener('message', function(e) {
                if (e.data && e.data.authenticated) {
                    authVerified = true;
                }
            });
            setTimeout(function() {
                if (!authVerified) {
                    window.location.href = 'index.html';
                }
            }, 1000);
        } else {
            window.location.href = 'index.html';
        }

        function navigate(page) {
            // Tell parent to navigate the iframe
            window.parent.postMessage({ navigate: page }, '*');
        }
    </script>
</head>
<body>
    <div class="select-container">
        <h1>Wybierz widok</h1>
        <button class="view-btn" onclick="navigate('plot.html')">
            <span><strong>Pomiary</strong> wykonane dla budynku &ndash; zestawienie</span>
            <span class="btn-arrow">&#8250;</span>
        </button>
        <button class="view-btn" onclick="navigate('simulations_case_study.html')">
            <span><strong>Obliczenia</strong> wykonane dla budynku &ndash; studium przypadku</span>
            <span class="btn-arrow">&#8250;</span>
        </button>
        <button class="view-btn" onclick="navigate('simulations_new.html')">
            <span><strong>Symulacje</strong> &ndash; oblicz dla nowych warunków</span>
            <span class="btn-arrow">&#8250;</span>
        </button>
    </div>
    <button class="dm-switch" id="dmToggle" title="Tryb ciemny / jasny"><span class="dm-knob"></span></button>
    <script>
        /* ── Dark-mode logic ── */
        function applyDark(on) {
            document.body.classList.toggle('dark', on);
            // knob position handled by CSS via body.dark class
            localStorage.setItem('darkMode', on ? '1' : '0');
        }
        // Init: check localStorage, then ask parent
        applyDark(localStorage.getItem('darkMode') === '1');
        window.addEventListener('message', function(e) {
            if (e.data && typeof e.data.darkMode === 'boolean') {
                applyDark(e.data.darkMode);
            }
        });
        window.parent.postMessage('getDarkMode', '*');
        document.getElementById('dmToggle').addEventListener('click', function() {
            var on = !document.body.classList.contains('dark');
            applyDark(on);
            // Propagate to parent so sibling pages stay in sync
            window.parent.postMessage({ setDarkMode: on }, '*');
        });
    </script>
</body>
</html>
