<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wybór widoku</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f0f0 url('data/background.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(240, 240, 240, 0.85);
            z-index: 0;
        }
        .select-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 2.5rem;
            max-width: 650px;
            width: 90%;
        }
        .select-container h1 {
            text-align: center;
            color: #333;
            font-size: 1.5em;
            margin-bottom: 0.5rem;
        }
        .view-btn {
            display: block;
            width: 100%;
            padding: 2rem 2.5rem;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 1.15em;
            color: #333;
            line-height: 1.5;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-decoration: none;
        }
        .view-btn:hover {
            border-color: #007bff;
            box-shadow: 0 4px 16px rgba(0,123,255,0.18);
            transform: translateY(-2px);
        }
        .view-btn:active {
            transform: translateY(0);
        }
        .view-btn strong {
            color: #007bff;
            font-size: 1.1em;
        }
    </style>
    <script>
        // Auth guard — must be inside the parent iframe
        let authVerified = false;

        if (window.parent !== window) {
            window.parent.postMessage('checkAuth', '*');
            window.addEventListener('message', function(e) {
                if (e.data && e.data.authenticated) {
                    authVerified = true;
                }
            });
            setTimeout(function() {
                if (!authVerified) {
                    window.location.href = 'index.html';
                }
            }, 1000);
        } else {
            window.location.href = 'index.html';
        }

        function navigate(page) {
            // Tell parent to navigate the iframe
            window.parent.postMessage({ navigate: page }, '*');
        }
    </script>
</head>
<body>
    <div class="select-container">
        <h1>Wybierz widok</h1>
        <button class="view-btn" onclick="navigate('plot.html')">
            <strong>Pomiary</strong> wykonane dla budynku &ndash; zestawienie
        </button>
        <button class="view-btn" onclick="navigate('simulations_case_study.html')">
            <strong>Symulacje</strong> wykonane dla budynku &ndash; studium przypadku
        </button>
        <button class="view-btn" onclick="navigate('simulations_new.html')">
            <strong>Symulacje</strong> &ndash; oblicz dla nowych warunków
        </button>
    </div>
</body>
</html>
